# 차단 목록을 검사·서명해 dist/에 올린다 (Duo Browser 보안 B).
# domains.txt가 바뀌면 바로, 그리고 매일 한 번 돈다. 목록이 같으면 아무것도 바꾸지 않는다.
name: 차단 목록 서명

on:
  push:
    branches: [main]
    paths: [domains.txt, scripts/**, .github/workflows/**]
  schedule:
    - cron: "17 18 * * *"   # 매일 03:17 (한국 시각)
  workflow_dispatch:
    inputs:
      force:
        description: "목록이 같아도 새 버전으로 다시 서명 (서명 키 점검용)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==44.0.0
      - name: 검사하고 서명
        env:
          BLOCKLIST_SIGNING_KEY: ${{ secrets.BLOCKLIST_SIGNING_KEY }}
          FORCE_SIGN: ${{ inputs.force && '1' || '0' }}
        run: python scripts/build.py
      - name: 올릴 파일의 서명 확인 (앱과 같은 공개 키)
        run: python scripts/verify.py
      - name: 바뀌었으면 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "차단 목록 서명 갱신" && git push
